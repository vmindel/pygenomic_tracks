[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "pygenomic-tracks"
version = "0.1.0"
description = "Genome-browser-style tracks from pandas DataFrames, drawn on matplotlib axes"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Vova Mindel", email = "vovamindel@gmail.com" }]
keywords = ["bioinformatics", "genomics", "genome browser", "tracks", "matplotlib", "misha", "ChEC-seq", "ChIP-seq"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
bigwig = ["pyBigWig"]
test = ["pytest>=7"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26", "ruff"]

[project.scripts]
pygt = "pygenomic_tracks.__main__:main"
pygt-install-skills = "pygenomic_tracks._skills.install:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pygenomic_tracks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
